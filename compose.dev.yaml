services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    # Live-mount application code for instant reflection without rebuilds
    volumes:
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./database:/var/www/html/database
      # Override OPcache with dev settings (instant revalidation)
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      TZ: Africa/Harare
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./database:/var/www/html/database
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      TZ: Africa/Harare
      SCHEDULE_AUTO_ASSIGN: "false"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    # Serve latest static assets from host
    ports:
      - "8087:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: Africa/Harare
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: impaza
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      TZ: Africa/Harare
    command: ["--default-time-zone=+02:00"]
    volumes:
      - dbdata_dev:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:16379:6379"
    environment:
      TZ: Africa/Harare
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8088:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      TZ: Africa/Harare
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  dbdata_dev:
