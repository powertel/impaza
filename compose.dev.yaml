services:
  app:
    # Live-mount application code for instant reflection without rebuilds
    volumes:
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./database:/var/www/html/database
      # Override OPcache with dev settings (instant revalidation)
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  nginx:
    # Serve latest static assets from host
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # One-off helper: install Dompdf in the app via Composer
  composer_dompdf:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["composer", "require", "barryvdh/laravel-dompdf:^2.0"]